<div>
  <h2><a href="{% url 'place_detail' place.id %}">{{ place.name }}</a></h2>
  <h2>{{ place.name }}</h2>
  <p>{{ place.description|truncatewords:10 }}</p>
  <p>{{ place.kind }}</p>
  <p>{{ place.location|default:"Secret place" }}</p>
  <p>{{ place.stars }}</p>
  <p>{{ place.created }}</p>
</div>
